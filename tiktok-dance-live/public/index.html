<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17220e">
<title>Gift Dance Live</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b07;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}button,input{font:inherit}.stage{position:relative;width:100vw;height:100dvh;overflow:hidden;isolation:isolate;background:linear-gradient(#9eb96b 0 39%,#73944e 39% 57%,#665039 57%)}.stage:before{content:"";position:absolute;inset:0;z-index:-4;background:radial-gradient(circle at 50% 9%,#fff1a06b 0 7%,transparent 22%),linear-gradient(90deg,#18391566,transparent 30% 70%,#18391566)}.sun{position:absolute;left:50%;top:8%;width:22vmin;height:22vmin;transform:translateX(-50%);border-radius:50%;background:#ffe795;filter:blur(.2px);box-shadow:0 0 80px #ffe79577;opacity:.75;z-index:-3}.mountain{position:absolute;left:-12%;right:-12%;top:31%;height:29%;background:linear-gradient(145deg,#45662f,#263f24);clip-path:polygon(0 63%,12% 35%,22% 55%,35% 17%,45% 53%,58% 23%,69% 55%,83% 28%,100% 62%,100% 100%,0 100%);opacity:.68;z-index:-2}.ground{position:absolute;inset:57% -18% -14%;background:radial-gradient(ellipse at 50% 0,#967348,#4c3928 62%);transform:perspective(650px) rotateX(55deg);transform-origin:top;z-index:-1}.leaf{position:absolute;width:26vmin;height:58vmin;background:linear-gradient(110deg,#315f2c,#6e9a44);border-radius:100% 0 100% 0;opacity:.72;filter:drop-shadow(0 8px 12px #0004);z-index:1}.l1{left:-7%;top:-4%;transform:rotate(-22deg)}.l2{right:-6%;top:1%;transform:scaleX(-1) rotate(-17deg)}.l3{left:4%;top:26%;width:18vmin;height:42vmin;opacity:.38}.l4{right:3%;top:25%;width:19vmin;height:43vmin;opacity:.38;transform:scaleX(-1)}
.gift{position:absolute;z-index:50;top:max(18px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-145%);opacity:0;width:min(90vw,620px);display:flex;align-items:center;gap:13px;padding:12px 15px;border-radius:20px;background:#10180dcc;border:1px solid #ffffff2e;backdrop-filter:blur(14px);box-shadow:0 18px 45px #0006;transition:.35s}.gift.show{transform:translate(-50%,0);opacity:1}.gift .ico{font-size:32px}.gift b,.gift span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gift b{font-size:clamp(15px,3.1vw,23px)}.gift span{opacity:.72;font-size:12px;margin-top:2px}
.crew{position:absolute;z-index:8;left:50%;bottom:1%;width:min(99vw,850px);height:82%;transform:translateX(-50%);filter:drop-shadow(0 20px 15px #0005)}.d{--skin1:#6a432f;--skin2:#3c241b;--shirt1:#b04e2b;--shirt2:#6e2f1e;--pants:#26201d;--hair:#17110f;--band:#f2b134;position:absolute;width:22%;height:45%;transform-origin:50% 92%;animation:idle 1.08s ease-in-out infinite alternate}.d2{--skin1:#76503b;--skin2:#432b21;--shirt1:#1e6472;--shirt2:#123c47;--band:#ef5f5f}.d3{--skin1:#60402f;--skin2:#39251c;--shirt1:#80612b;--shirt2:#4b381d;--band:#59b969}.d4{--skin1:#704733;--skin2:#3e271d;--shirt1:#562d77;--shirt2:#321b49;--band:#47a7d9}.d5{--skin1:#7b5037;--skin2:#42291e;--shirt1:#c16a2e;--shirt2:#75401f;--band:#f3d34a}.d .head{position:absolute;left:31%;top:3%;width:38%;aspect-ratio:.86;border-radius:48% 48% 45% 45%;background:linear-gradient(125deg,var(--skin1),var(--skin2));z-index:8;box-shadow:inset -8px -7px 13px #0004,0 3px 0 #0002}.ear{position:absolute;top:42%;width:15%;height:22%;border-radius:50%;background:var(--skin2);z-index:-1}.ear.e1{left:-9%}.ear.e2{right:-9%}.hair{position:absolute;left:5%;right:5%;top:-9%;height:31%;border-radius:55% 55% 28% 28%;background:var(--hair);box-shadow:inset 0 -6px 0 #0003}.hair:before,.hair:after{content:"";position:absolute;top:-12%;width:24%;aspect-ratio:1;border-radius:50%;background:var(--hair)}.hair:before{left:13%}.hair:after{right:13%}.band{position:absolute;left:1%;right:1%;top:12%;height:8%;border-radius:999px;background:var(--band);box-shadow:0 2px 0 #0004}.brow{position:absolute;top:34%;width:23%;height:5%;border-radius:999px;background:#1b120f;transition:.2s}.brow.b1{left:18%;transform:rotate(-5deg)}.brow.b2{right:18%;transform:rotate(5deg)}.eye{position:absolute;top:41%;width:22%;height:18%;border-radius:50%;background:#fff8e8;box-shadow:inset 0 -2px 0 #d5c9b7;overflow:hidden;animation:blink 4.2s infinite}.eye.e1{left:17%}.eye.e2{right:17%}.eye i{position:absolute;left:50%;top:48%;width:42%;aspect-ratio:1;border-radius:50%;background:#261b16;transform:translate(-50%,-50%);box-shadow:inset 0 0 0 22% #6d4a2f}.eye i:after{content:"";position:absolute;left:22%;top:17%;width:28%;height:28%;border-radius:50%;background:white}.nose{position:absolute;left:46%;top:55%;width:10%;height:13%;border-radius:45% 45% 55% 55%;background:#2d1a14aa;box-shadow:-3px 1px 0 #ffffff12}.mouth{position:absolute;left:28%;right:28%;bottom:13%;height:11%;border-radius:0 0 50% 50%;background:#29120f;overflow:hidden;transition:.18s}.mouth:before{content:"";position:absolute;left:9%;right:9%;top:0;height:44%;background:#fff6df;border-radius:0 0 8px 8px}.mouth:after{content:"";position:absolute;left:27%;right:27%;bottom:-2%;height:35%;background:#b84943;border-radius:50% 50% 0 0}.neck{position:absolute;left:43%;top:25%;width:14%;height:11%;background:linear-gradient(var(--skin1),var(--skin2));z-index:4;border-radius:0 0 8px 8px}.body{position:absolute;left:24%;top:31%;width:52%;height:39%;border-radius:24% 24% 13% 13%;background:linear-gradient(105deg,var(--shirt1),var(--shirt2));z-index:4;box-shadow:inset -10px 0 18px #0003}.body:before{content:"";position:absolute;left:44%;top:4%;width:12%;height:48%;background:#ffffff13;border-radius:999px}.necklace{position:absolute;left:33%;top:32%;width:34%;height:15%;border:3px solid #f0c34c;border-top:0;border-radius:0 0 50% 50%;z-index:7;opacity:.85}.arm,.leg{position:absolute;border-radius:999px;transform-origin:50% 8%}.arm{top:35%;width:11.5%;height:36%;z-index:3;background:linear-gradient(var(--skin1),var(--skin2))}.arm.a1{left:18%;transform:rotate(6deg)}.arm.a2{right:18%;transform:rotate(-6deg)}.hand{position:absolute;bottom:-5%;left:-13%;width:126%;aspect-ratio:1;border-radius:50%;background:var(--skin1);box-shadow:inset -3px -2px 0 #0002}.leg{top:65%;width:14%;height:32%;background:linear-gradient(var(--pants),#151311);z-index:2}.leg.g1{left:32%;transform:rotate(3deg)}.leg.g2{right:32%;transform:rotate(-3deg)}.foot{position:absolute;bottom:-3%;width:150%;height:21%;border-radius:70% 35% 35% 45%;background:#171413}.g1 .foot{left:-50%}.g2 .foot{right:-50%;transform:scaleX(-1)}.bubble{position:absolute;z-index:15;left:50%;top:-4%;transform:translate(-50%,-25%) scale(.65);opacity:0;background:white;color:#17130f;font-weight:950;border-radius:999px;padding:6px 10px;font-size:clamp(9px,1.8vw,15px);white-space:nowrap;box-shadow:0 6px 16px #0004}.bubble.pop{animation:bpop 1.15s ease forwards}.d1{left:0;top:13%;--delay:.04s}.d2{left:38%;top:2%;--delay:.12s}.d3{right:-1%;top:14%;--delay:.19s}.d4{left:57%;top:31%;width:27%;height:49%;--delay:.08s}.d5{left:17%;top:34%;width:38%;height:61%;z-index:12;--delay:0s}.d5 .head{width:41%;left:29.5%}.d5 .eye{height:19%}.d5 .mouth{height:12%}
.react-low .d{animation:low .34s ease-in-out 4}.react-mid .d{animation:stomp .42s ease-in-out 4}.react-high .d{animation:jump .52s cubic-bezier(.2,.75,.25,1.1) 4}.react-max .d{animation:frenzy .25s linear 11}.react-low .d,.react-mid .d,.react-high .d,.react-max .d{animation-delay:var(--delay)}.react-mid .arm,.react-high .arm,.react-max .arm{animation:wave .28s ease-in-out 8}.react-high .mouth,.react-max .mouth{height:19%;border-radius:50%;bottom:9%}.react-high .brow.b1,.react-max .brow.b1{transform:rotate(12deg)}.react-high .brow.b2,.react-max .brow.b2{transform:rotate(-12deg)}.react-max .eye{height:22%;top:39%}.burst{position:absolute;z-index:5;inset:0;opacity:0;pointer-events:none;background:radial-gradient(circle at 50% 58%,#ffe98c99,transparent 10%),repeating-conic-gradient(from 0deg at 50% 58%,transparent 0 9deg,#fff1a83b 10deg 12deg)}.burst.on{animation:burst 1.1s ease-out}.flash{position:absolute;z-index:60;inset:0;background:white;opacity:0;pointer-events:none}.flash.on{animation:flash .45s ease-out}.shake{animation:shake .32s linear 3}
.badge{position:absolute;z-index:35;left:13px;bottom:max(13px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:999px;background:#0008;backdrop-filter:blur(9px);font-size:12px;max-width:67vw}.dot{width:8px;height:8px;border-radius:50%;background:#ff5454;box-shadow:0 0 0 4px #ff545422}.badge.ok .dot{background:#53ef80;box-shadow:0 0 0 4px #53ef8022}.badge.wait .dot{background:#ffd65d;animation:pulse 1s infinite}.badge b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gear{position:absolute;z-index:45;right:13px;bottom:max(13px,env(safe-area-inset-bottom));width:42px;height:42px;border:0;border-radius:50%;background:#0008;color:white;font-size:20px;backdrop-filter:blur(9px)}
.panel{position:absolute;z-index:70;right:12px;top:12px;bottom:12px;width:min(92vw,390px);padding:16px;border-radius:22px;background:#0f130dec;border:1px solid #ffffff25;backdrop-filter:blur(18px);box-shadow:0 28px 80px #0008;transform:translateX(calc(100% + 30px));transition:.3s;overflow:auto}.panel.open{transform:translateX(0)}.panel header{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:14px}.panel header button{border:0;background:transparent;color:white;font-size:28px}.panel label{display:block;font-size:13px;font-weight:800;margin:11px 0 7px}.panel input:not([type=range]){width:100%;padding:11px 12px;border-radius:12px;border:1px solid #ffffff2a;background:#ffffff12;color:white;outline:none}.row{display:flex;gap:8px;align-items:center}.row input{flex:1}.panel button{border:0;border-radius:12px;padding:11px 13px;background:#ff315f;color:white;font-weight:900}.panel .muted{background:#ffffff18}.wide{width:100%}.sep{height:1px;background:#ffffff1c;margin:16px 0}.test{display:grid;grid-template-columns:1fr 1fr;gap:8px}.test button{background:#ffffff15}.status{font-size:12px;opacity:.72;min-height:18px}.panel small{display:block;margin-top:13px;opacity:.55;line-height:1.35}.unlock{position:absolute;z-index:120;inset:0;display:grid;place-items:center;text-align:center;padding:28px;background:#061003c7;backdrop-filter:blur(10px);transition:.35s}.unlock.hide{opacity:0;visibility:hidden}.unlock h1{font-size:clamp(30px,8vw,54px);margin:0}.unlock p{opacity:.75}.unlock button{border:0;border-radius:999px;padding:14px 22px;background:white;color:#14170f;font-weight:900;font-size:17px}
@keyframes idle{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-1.8%) rotate(1.4deg)}}@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}@keyframes low{50%{transform:translateY(-8%) scale(1.03,.97)}}@keyframes stomp{30%{transform:translate(-4%,-5%) rotate(-4deg)}65%{transform:translate(5%,1%) rotate(5deg)}}@keyframes jump{40%{transform:translateY(-19%) rotate(-4deg)}70%{transform:translateY(-6%) rotate(5deg)}}@keyframes frenzy{0%{transform:translate(-2%,0) rotate(-4deg)}25%{transform:translate(3%,-8%) rotate(5deg)}50%{transform:translate(-4%,-2%) rotate(-6deg)}75%{transform:translate(4%,-10%) rotate(6deg)}}@keyframes wave{50%{transform:rotate(120deg)}}@keyframes bpop{0%{opacity:0;transform:translate(-50%,-10%) scale(.55)}15%,70%{opacity:1;transform:translate(-50%,-38%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@keyframes burst{0%{opacity:0;transform:scale(.55)}18%{opacity:1}100%{opacity:0;transform:scale(1.7) rotate(30deg)}}@keyframes flash{0%{opacity:.7}100%{opacity:0}}@keyframes shake{25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,-2px)}}@keyframes pulse{50%{opacity:.35}}@media(min-aspect-ratio:3/4){.stage{width:min(56.25vh,100vw);height:100vh;margin:auto}}
</style>
</head>
<body>
<main id="stage" class="stage">
<div class="sun"></div><div class="mountain"></div><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div><div class="leaf l4"></div><div class="ground"></div>
<section id="gift" class="gift"><div id="ico" class="ico">🌹</div><div><b id="who">Hediye bekleniyor</b><span id="meta">Canlı yayına bağlanınca otomatik çalışır</span></div></section>
<section id="crew" class="crew"></section>
<div id="burst" class="burst"></div><div id="flash" class="flash"></div>
<div id="badge" class="badge"><i class="dot"></i><b>TikTok bağlı değil</b></div><button id="gear" class="gear">⚙</button>
<aside id="panel" class="panel"><header><strong>Canlı Kontrol</strong><button id="close">×</button></header><label>TikTok kullanıcı adı</label><div class="row"><input id="username" placeholder="@kullaniciadi"><button id="connect">Bağlan</button></div><p id="status" class="status">TikTok bağlı değil</p><button id="disconnect" class="muted wide">Bağlantıyı kes</button><div class="sep"></div><label>Arka plan müziği</label><input id="musicFile" type="file" accept="audio/*"><div class="row" style="margin-top:8px"><button id="musicToggle" class="muted">Aç/Kapat</button><input id="volume" type="range" min="0" max="1" step=".05" value=".55"></div><div class="sep"></div><label>Test kullanıcı adı</label><input id="testName" value="Furkan"><div class="test" style="margin-top:8px"><button data-d="1">🌹 1</button><button data-d="25">🎁 25</button><button data-d="150">🦢 150</button><button data-d="600">🦁 600</button></div><small>Gerçek hediye geldiğinde lider ismi söyler; ekip sırayla ve ardından birlikte tepki verir.</small></aside>
<section id="unlock" class="unlock"><div><h1>Gift Dance Live</h1><p>Ses ve animasyonu etkinleştirmek için bir kez dokun.</p><button id="start">Yayını Başlat</button></div></section>
</main>
<audio id="music" loop></audio><script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],socket=io(),stage=$('#stage'),crew=$('#crew'),gift=$('#gift'),who=$('#who'),meta=$('#meta'),ico=$('#ico'),burst=$('#burst'),flash=$('#flash'),badge=$('#badge'),status=$('#status'),music=$('#music');let q=[],busy=false,unlocked=false,voice=null,timer;
function dancer(i){return `<div class="d d${i}"><div class="bubble"></div><div class="head"><span class="ear e1"></span><span class="ear e2"></span><span class="hair"></span><span class="band"></span><span class="brow b1"></span><span class="brow b2"></span><span class="eye e1"><i></i></span><span class="eye e2"><i></i></span><span class="nose"></span><span class="mouth"></span></div><div class="neck"></div><div class="body"></div><div class="necklace"></div><div class="arm a1"><i class="hand"></i></div><div class="arm a2"><i class="hand"></i></div><div class="leg g1"><i class="foot"></i></div><div class="leg g2"><i class="foot"></i></div></div>`}crew.innerHTML=[1,2,3,4,5].map(dancer).join('');
function voices(){let v=speechSynthesis?.getVoices?.()||[];voice=v.find(x=>/^tr/i.test(x.lang))||v[0]||null}if('speechSynthesis'in window){voices();speechSynthesis.onvoiceschanged=voices}
function nameClean(n='Misafir'){return String(n).replace(/[_.]+/g,' ').replace(/[^\p{L}\p{N} çğıöşüÇĞİÖŞÜ-]/gu,'').trim().slice(0,28)||'Misafir'}
function tier(d){d=Number(d||1);return d>=500?{c:'react-max',i:'🦁',t:3400,r:3}:d>=100?{c:'react-high',i:'🦢',t:2950,r:2}:d>=10?{c:'react-mid',i:'🎁',t:2550,r:2}:{c:'react-low',i:'🌹',t:2150,r:1}}
function say(txt,rate=1,pitch=1){if(!unlocked||!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(txt);u.lang='tr-TR';u.rate=rate;u.pitch=pitch;if(voice)u.voice=voice;speechSynthesis.speak(u)}
function bubbles(n){$$('.d').forEach((d,i)=>setTimeout(()=>{let b=d.querySelector('.bubble');b.textContent=n;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')},i===4?0:470+i*85))}
async function react(g){let t=tier(g.diamonds),n=nameClean(g.displayName||g.uniqueId);clearTimeout(timer);who.textContent=n;meta.textContent=`${g.giftName||'Hediye'} x${g.repeatCount||1}${g.diamonds?` • ${g.diamonds} elmas`:''}`;ico.textContent=t.i;gift.classList.add('show');crew.className='crew '+t.c;bubbles(n);try{speechSynthesis.cancel()}catch{}say(n,.91,.78);setTimeout(()=>{for(let i=0;i<t.r;i++)setTimeout(()=>say(n,1.05,1.04),i*430)},620);if(t.c==='react-mid'){stage.classList.add('shake');setTimeout(()=>stage.classList.remove('shake'),1000)}if(t.c==='react-high'||t.c==='react-max'){burst.classList.remove('on');void burst.offsetWidth;burst.classList.add('on')}if(t.c==='react-max'){flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');stage.classList.add('shake');setTimeout(()=>stage.classList.remove('shake'),1300)}await new Promise(r=>setTimeout(r,t.t));crew.className='crew';gift.classList.remove('show')}
async function pump(){if(busy||!q.length)return;busy=true;while(q.length)await react(q.shift());busy=false}socket.on('gift',g=>{q.push(g);if(q.length>20)q=q.slice(-20);pump()});socket.on('tiktok-status',d=>{badge.classList.remove('ok','wait');if(d.status==='connected')badge.classList.add('ok');if(d.status==='connecting'||d.status==='reconnecting')badge.classList.add('wait');badge.querySelector('b').textContent=d.message||'TikTok';status.textContent=d.message||'';$('#connect').disabled=d.status==='connecting';$('#connect').textContent=d.status==='connecting'?'Bağlanıyor…':'Bağlan';if(d.username&&!$('#username').value)$('#username').value='@'+d.username});
$('#start').onclick=()=>{unlocked=true;$('#unlock').classList.add('hide');say('Yayın hazır',1,.9);if(music.src)music.play().catch(()=>{})};$('#gear').onclick=()=>$('#panel').classList.add('open');$('#close').onclick=()=>$('#panel').classList.remove('open');document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#panel').classList.remove('open');if(e.key.toLowerCase()==='s')$('#panel').classList.toggle('open')});
$('#connect').onclick=()=>{let username=$('#username').value.trim();if(!username){status.textContent='Kullanıcı adı gir.';return}status.textContent='Bağlanıyor…';socket.emit('connect-tiktok',{username},r=>{if(!r?.ok)status.textContent=r?.error||'Bağlanamadı'})};$('#username').onkeydown=e=>{if(e.key==='Enter')$('#connect').click()};$('#disconnect').onclick=()=>socket.emit('disconnect-tiktok',{},()=>{});$$('[data-d]').forEach(b=>b.onclick=()=>socket.emit('simulate-gift',{displayName:$('#testName').value||'Furkan',diamonds:Number(b.dataset.d)},()=>{}));$('#musicFile').onchange=e=>{let f=e.target.files?.[0];if(!f)return;if(music.dataset.u)URL.revokeObjectURL(music.dataset.u);let u=URL.createObjectURL(f);music.dataset.u=u;music.src=u;if(unlocked)music.play().catch(()=>{})};$('#musicToggle').onclick=()=>music.paused?music.play().catch(()=>{}):music.pause();$('#volume').oninput=e=>music.volume=Number(e.target.value);music.volume=.55;setInterval(()=>fetch('/health',{cache:'no-store'}).catch(()=>{}),60000);
</script>
</body>
</html>
