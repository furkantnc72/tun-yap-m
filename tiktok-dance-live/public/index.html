<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17220e"><title>Gift Dance Live</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e08;color:white;font-family:Inter,system-ui,-apple-system,sans-serif}button,input{font:inherit}.stage{position:relative;width:100vw;height:100dvh;overflow:hidden;isolation:isolate;background:linear-gradient(#9aad62 0 45%,#6f8a48 45% 61%,#5e482c 61%)}.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 20%,rgba(255,240,169,.35),transparent 29%),linear-gradient(90deg,rgba(13,35,10,.3),transparent 32% 68%,rgba(13,35,10,.3));z-index:-2}.ground{position:absolute;inset:59% -20% -10%;background:radial-gradient(ellipse at 50% 0,#8b6a3b,#4a3926 65%);transform:perspective(600px) rotateX(52deg);transform-origin:top}.leaf{position:absolute;width:28vmin;height:58vmin;background:linear-gradient(110deg,#315d29,#6d913d);border-radius:100% 0 100% 0;opacity:.72;filter:drop-shadow(0 8px 12px #0004)}.l1{left:-8%;top:-5%;transform:rotate(-22deg)}.l2{right:-7%;top:4%;transform:scaleX(-1) rotate(-14deg)}.l3{left:5%;top:23%;width:20vmin;height:44vmin;opacity:.42}.l4{right:4%;top:24%;width:21vmin;height:46vmin;opacity:.42;transform:scaleX(-1)}
.gift{position:absolute;z-index:30;top:max(18px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-150%);opacity:0;width:min(90vw,620px);display:flex;align-items:center;gap:13px;padding:12px 15px;border-radius:20px;background:#111b0dcc;border:1px solid #ffffff2e;backdrop-filter:blur(14px);box-shadow:0 18px 45px #0006;transition:.35s}.gift.show{transform:translate(-50%,0);opacity:1}.gift .ico{font-size:32px}.gift b,.gift span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gift b{font-size:clamp(15px,3.1vw,23px)}.gift span{opacity:.72;font-size:12px;margin-top:2px}

animation:stomp .42s ease-in-out 4}.react-high .d{animation:jump .52s cubic-bezier(.2,.75,.25,1.1) 4}.react-max .d{animation:frenzy .25s linear 11}.react-low .d,.react-mid .d,.react-high .d,.react-max .d{animation-delay:var(--delay)}.react-mid .arm,.react-high .arm,.react-max .arm{animation:wave .28s ease-in-out 8}.burst{position:absolute;z-index:5;inset:0;opacity:0;pointer-events:none;background:radial-gradient(circle at 50% 59%,#ffe98c99,transparent 10%),repeating-conic-gradient(from 0deg at 50% 59%,transparent 0 9deg,#fff1a83b 10deg 12deg)}.burst.on{animation:burst 1.1s ease-out}.flash{position:absolute;z-index:40;inset:0;background:white;opacity:0;pointer-events:none}.flash.on{animation:flash .45s ease-out}.shake{animation:shake .32s linear 3}

</style></head><body><main id="stage" class="stage"><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div><div class="leaf l4"></div><div class="ground"></div>

</section><div id="burst" class="burst"></div><div id="flash" class="flash"></div><div id="badge" class="badge"><i class="dot"></i><b>TikTok bağlı değil</b></div><button id="gear" class="gear">⚙</button>
<aside id="panel" class="panel"><header><strong>Canlı Kontrol</strong><button id="close">×</button></header><label>TikTok kullanıcı adı</label><div class="row"><input id="username" placeholder="@kullaniciadi"><button id="connect">Bağlan</button></div><p id="status" class="status">TikTok bağlı değil</p><button id="disconnect" class="muted wide">Bağlantıyı kes</button><div class="sep"></div><label>Arka plan müziği</label><input id="musicFile" type="file" accept="audio/*"><div class="row" style="margin-top:8px"><button id="musicToggle" class="muted">Aç/Kapat</button><input id="volume" type="range" min="0" max="1" step=".05" value=".55"></div><div class="sep"></div><label>Test kullanıcı adı</label><input id="testName" value="Furkan"><div class="test" style="margin-top:8px"><button data-d="1">🌹 1</button><button data-d="25">🎁 25</button><button data-d="150">🦢 150</button><button data-d="600">🦁 600</button></div><small>Yayında paneli ⚙ ile kapat. Gerçek hediye geldiğinde hareketler otomatik tetiklenir.</small></aside>
<section id="unlock" class="unlock"><div><h1>Gift Dance Live</h1><p>Ses ve animasyonu etkinleştirmek için bir kez dokun.</p><button id="start">Yayını Başlat</button></div></section></main><audio id="music" loop></audio><script src="/socket.io/socket.io.js"></script><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],socket=io(),stage=$('#stage'),crew=$('#crew'),gift=$('#gift'),who=$('#who'),meta=$('#meta'),ico=$('#ico'),burst=$('#burst'),flash=$('#flash'),badge=$('#badge'),status=$('#status'),music=$('#music');let q=[],busy=false,unlocked=false,voice=null,timer;
function voices(){let v=speechSynthesis?.getVoices?.()||[];voice=v.find(x=>/^tr/i.test(x.lang))||v[0]||null}if('speechSynthesis'in window){voices();speechSynthesis.onvoiceschanged=voices}
function nameClean(n='Misafir'){return String(n).replace(/[_.]+/g,' ').replace(/[^\p{L}\p{N} çğıöşüÇĞİÖŞÜ-]/gu,'').trim().slice(0,28)||'Misafir'}
function tier(d){d=Number(d||1);return d>=500?{c:'react-max',i:'🦁',t:3300,r:3}:d>=100?{c:'react-high',i:'🦢',t:2850,r:2}:d>=10?{c:'react-mid',i:'🎁',t:2450,r:2}:{c:'react-low',i:'🌹',t:2050,r:1}}
function say(txt,rate=1,pitch=1){if(!unlocked||!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(txt);u.lang='tr-TR';u.rate=rate;u.pitch=pitch;if(voice)u.voice=voice;speechSynthesis.speak(u)}
function bubbles(n){$$('.d').forEach((d,i)=>setTimeout(()=>{let b=d.querySelector('.bubble');b.textContent=n;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')},i===4?0:520+i*65))}
async function react(g){let t=tier(g.diamonds),n=nameClean(g.displayName||g.uniqueId);clearTimeout(timer);who.textContent=n;meta.textContent=`${g.giftName||'Hediye'} x${g.repeatCount||1}${g.diamonds?` • ${g.diamonds} elmas`:''}`;ico.textContent=t.i;gift.classList.add('show');crew.className='crew '+t.c;bubbles(n);try{speechSynthesis.cancel()}catch{}say(n,.92,.8);setTimeout(()=>{for(let i=0;i<t.r;i++)setTimeout(()=>say(n,1.05,1.05),i*420)},650);if(t.c==='react-mid'){stage.classList.add('shake');setTimeout(()=>stage.classList.remove('shake'),1000)}if(t.c==='react-high'||t.c==='react-max'){burst.classList.remove('on');void burst.offsetWidth;burst.classList.add('on')}if(t.c==='react-max'){flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');stage.classList.add('shake');setTimeout(()=>stage.classList.remove('shake'),1300)}await new Promise(r=>setTimeout(r,t.t));crew.className='crew';gift.classList.remove('show')}
async function pump(){if(busy||!q.length)return;busy=true;while(q.length)await react(q.shift());busy=false}socket.on('gift',g=>{q.push(g);if(q.length>20)q=q.slice(-20);pump()});socket.on('tiktok-status',d=>{badge.classList.remove('ok','wait');if(d.status==='connected')badge.classList.add('ok');if(d.status==='connecting'||d.status==='reconnecting')badge.classList.add('wait');badge.querySelector('b').textContent=d.message||'TikTok';status.textContent=d.message||'';$('#connect').disabled=d.status==='connecting';$('#connect').textContent=d.status==='connecting'?'Bağlanıyor…':'Bağlan';if(d.username&&!$('#username').value)$('#username').value='@'+d.username});
$('#start').onclick=()=>{unlocked=true;$('#unlock').classList.add('hide');say('Yayın hazır',1,.9);if(music.src)music.play().catch(()=>{})};$('#gear').onclick=()=>$('#panel').classList.add('open');$('#close').onclick=()=>$('#panel').classList.remove('open');document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#panel').classList.remove('open');if(e.key.toLowerCase()==='s')$('#panel').classList.toggle('open')});
$('#connect').onclick=()=>{let username=$('#username').value.trim();if(!username){status.textContent='Kullanıcı adı gir.';return}status.textContent='Bağlanıyor…';socket.emit('connect-tiktok',{username},r=>{if(!r?.ok)status.textContent=r?.error||'Bağlanamadı'})};$('#username').onkeydown=e=>{if(e.key==='Enter')$('#connect').click()};$('#disconnect').onclick=()=>socket.emit('disconnect-tiktok',{},()=>{});$$('[data-d]').forEach(b=>b.onclick=()=>socket.emit('simulate-gift',{displayName:$('#testName').value||'Furkan',diamonds:Number(b.dataset.d)},()=>{}));$('#musicFile').onchange=e=>{let f=e.target.files?.[0];if(!f)return;if(music.dataset.u)URL.revokeObjectURL(music.dataset.u);let u=URL.createObjectURL(f);music.dataset.u=u;music.src=u;if(unlocked)music.play().catch(()=>{})};$('#musicToggle').onclick=()=>music.paused?music.play().catch(()=>{}):music.pause();$('#volume').oninput=e=>music.volume=Number(e.target.value);music.volume=.55;setInterval(()=>fetch('/health',{cache:'no-store'}).catch(()=>{}),60000);
</script></body></html>
