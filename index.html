<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LIVE Kingdom Battle v3</title>
<style>
:root{--bg:#050b16;--panel:#0b1528e8;--line:#ffffff22;--red:#ff6464;--blue:#6b98ff;--gold:#ffd56c;--muted:#9fb0cf;--text:#f4f7ff}
*{box-sizing:border-box}html,body{margin:0;background:#02050c;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{display:flex;justify-content:center;min-height:100vh}
#app{position:relative;width:min(100vw,562.5px);aspect-ratio:9/16;overflow:hidden;background:radial-gradient(circle at 50% 0%,#243d6d 0,#0a1529 34%,#040914 72%,#02050b 100%)}
.top{position:absolute;left:0;right:0;top:0;padding:16px 14px 0;z-index:10}.brand{text-align:center;font-weight:1000;letter-spacing:1.5px;font-size:18px;text-shadow:0 4px 12px #000}
.hud{display:grid;grid-template-columns:1fr 96px 1fr;gap:10px;align-items:center;margin-top:10px}.teamRow{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:13px}.pill{padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:#ffffff12}.hp{height:18px;background:#151d2f;border:1px solid var(--line);border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 8px #0007}.hp>div{height:100%;transition:width .15s}.redFill{background:linear-gradient(90deg,#d83a3a,#ff7676)}.blueFill{background:linear-gradient(90deg,#456fe6,#7ea7ff)}.sub{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}.timerBox{padding:8px 4px;border-radius:14px;text-align:center;background:#0008;border:1px solid var(--line)}.timer{font-size:26px;font-weight:1000;line-height:1}
#game{position:absolute;left:0;top:110px;width:100%;height:64.5%;display:block}.toast{position:absolute;left:50%;top:21%;transform:translate(-50%,-8px) scale(.98);opacity:0;transition:.18s;z-index:20;min-width:72%;max-width:90%;padding:12px 14px;border-radius:18px;border:1px solid #ffffff28;background:linear-gradient(180deg,#0d1831f6,#08111ef1);font-weight:1000;font-size:18px;text-align:center;box-shadow:0 16px 40px #0008;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.bottom{position:absolute;left:12px;right:12px;bottom:12px;display:grid;gap:10px;z-index:11}.panel{background:var(--panel);border:1px solid #ffffff1e;border-radius:18px;padding:12px;box-shadow:0 10px 30px #0005}.panelHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.titleSm{font-size:13px;font-weight:1000;letter-spacing:.5px;color:#dfe7fa}.badge{font-size:10px;padding:3px 8px;border:1px solid #ffffff18;border-radius:999px;background:#ffffff10}.gifts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}.gift{text-align:center;font-size:10px;color:#cad5ec}.gift b{display:block;font-size:20px;margin-bottom:4px}.leaderboard{display:grid;gap:5px;margin-top:8px;font-size:11px}.row{display:grid;grid-template-columns:20px 1fr auto;gap:6px;align-items:center}.gold{color:var(--gold)}
.fab{position:absolute;right:10px;top:10px;z-index:30;padding:7px 11px;border:1px solid #3b5da3;border-radius:999px;background:#102245;color:#fff;font-size:11px;font-weight:900}.soundFab{right:86px;background:#1c1736;border-color:#6652c8}.overlay{position:absolute;inset:0;background:#000b;display:none;align-items:flex-end;z-index:40}.overlay.show{display:flex}.sheet{width:100%;max-height:82%;overflow:auto;background:#091425;border-top:1px solid #35528d;border-radius:22px 22px 0 0;padding:16px}.sheetHead{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:0;font-size:20px}.close{border:1px solid #2d426d;background:#12213f;color:#fff;border-radius:12px;padding:9px 12px;font-weight:800}label{display:block;margin:12px 0 5px;font-size:12px;font-weight:800}input,select{width:100%;padding:11px;border-radius:12px;border:1px solid #29406c;background:#07101e;color:#fff;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.ev{border:0;border-radius:13px;padding:13px 8px;color:#fff;font-size:14px;font-weight:1000;background:linear-gradient(180deg,#2e67ff,#214fcc)}.ev.alt{background:linear-gradient(180deg,#8c5bff,#6c43d7)}.ev.danger{background:linear-gradient(180deg,#ff7048,#e14a28)}.note{font-size:11px;color:#a2afd0;line-height:1.4;margin-top:10px}.winner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:25;background:#000a}.winner.show{display:flex}.winnerBox{padding:26px 22px;border-radius:24px;background:linear-gradient(180deg,#0d1730f2,#091220f4);border:1px solid #ffffff1f;text-align:center}.winner h1{margin:0 0 10px;font-size:32px}.winner p{margin:0;color:#dce5fb}@media (max-width:420px){.brand{font-size:15px}.timer{font-size:23px}}
</style>
</head>
<body>
<div id="app">
<button class="fab soundFab" id="soundToggle">🔇 Ses</button><button class="fab" id="openTest">🧪 Test</button>
<div class="top"><div class="brand">LIVE KINGDOM BATTLE</div><div class="hud"><div><div class="teamRow"><span class="pill" style="color:#ff9a9a">🔴 KIRMIZI</span><span id="redCount">0</span></div><div class="hp"><div class="redFill" id="redHpBar"></div></div><div class="sub"><span id="redHpText">100.0K</span> • Skor: <span id="redScore">0</span></div></div><div><div class="timerBox"><div class="timer" id="timer">30:00</div><div class="sub">Savaş #<span id="battleNo">1</span></div></div></div><div><div class="teamRow"><span id="blueCount">0</span><span class="pill" style="color:#9ec0ff">MAVİ 🔵</span></div><div class="hp"><div class="blueFill" id="blueHpBar"></div></div><div class="sub">Skor: <span id="blueScore">0</span> • <span id="blueHpText">100.0K</span></div></div></div></div>
<canvas id="game" width="1080" height="1100"></canvas><div class="toast" id="toast"></div>
<div class="bottom"><div class="panel"><div class="panelHead"><div class="titleSm gold">🏆 BUGÜNÜN KRALLARI</div><div class="badge">Canlı skor</div></div><div class="leaderboard" id="leaderboard"></div></div></div>
<div class="winner" id="winner"><div class="winnerBox"><h1 id="winnerTitle"></h1><p>Yeni savaş 10 saniye içinde başlıyor…</p></div></div>
<div class="overlay" id="overlay"><div class="sheet"><div class="sheetHead"><h2>🧪 Test Paneli</h2><button class="close" id="closeTest">Kapat</button></div><label>Kullanıcı adı</label><input id="testName" value="Furkan1903"><label>Takım</label><select id="testTeam"><option value="red">🔴 Kırmızı</option><option value="blue">🔵 Mavi</option></select><div class="grid"><button class="ev" data-action="soldier">🌹 Asker</button><button class="ev" data-action="knight">⚔️ Şövalye</button><button class="ev" data-action="archers">🏹 Okçular</button><button class="ev" data-action="giant">🗿 Dev</button><button class="ev" data-action="dragon">🐉 Ejderha</button><button class="ev" data-action="tank">🪖 Tank</button><button class="ev" data-action="hero">🦸 Kahraman</button><button class="ev" data-action="wizard">⚡ Büyücü</button><button class="ev" data-action="iceMage">❄️ Buz Büyücüsü</button><button class="ev" data-action="stormGod">🌩️ Fırtına Tanrısı</button><button class="ev" data-action="ninja">🥷 Gölge</button><button class="ev" data-action="mech">🤖 Mecha</button><button class="ev danger" data-action="robotBoss">🤖 Dev Robot Boss</button><button class="ev danger" data-action="nuke">☢️ Nükleer</button><button class="ev alt" data-action="meteor">☄️ Meteor</button><button class="ev alt" data-action="tornado">🌪️ Kasırga</button><button class="ev alt" data-action="king">👑 King Mode</button><button class="ev danger" data-action="boss">☠️ Boss</button><button class="ev danger" data-action="heal">✨ Güçlendir</button></div><div class="note">Bu sürümde test paneli oyunun içine gömülü. Böylece telefon üzerinde de tek ekrandan çalışır.</div></div></div>
</div>
<script>
(async()=>{
  const files=['game-v14-1.txt','game-v14-2.txt','game-v14-3.txt','game-v14-4.txt','game-v14-5.txt','game-v14-6.txt','game-v14-7.txt','game-v14-8.txt'];
  const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Oyun dosyası yüklenemedi: '+f);return r.text()})));
  (0,eval)(parts.join(''));
})().catch(err=>{console.error(err);document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:auto 10px 10px 10px;z-index:9999;background:#8b1e2d;color:white;padding:12px;border-radius:12px;font:700 13px system-ui">Oyun yükleme hatası. Sayfayı yenile.</div>')});
</script>
</body></html>
